[project]
name = "allegro-a89301"
version = "0.0.0"
description = "I2C command generation and parsing library for the Allegro A89301 sensorless BLDC motor controller"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["smbus2>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/allegro_a89301"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.16.1"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E731"]  # allow named lambdas for the small inline conversion functions

[tool.pytest.ini_options]
python_files = "*.spec.py"
addopts = "--import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src"]
